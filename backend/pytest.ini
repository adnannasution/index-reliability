[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error::SyntaxWarning
    # pymoo 0.6.x memakai alias numpy dan properti yang sudah usang secara
    # internal; peringatan ini berasal dari pustaka, bukan dari kode aplikasi.
    ignore:.*row_stack.*:DeprecationWarning
    ignore:.*feasible.*:DeprecationWarning
