server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Berkas Excel ekspor SAP bisa mencapai puluhan MB.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset ber-hash boleh di-cache lama; index.html tidak boleh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Semua panggilan API diteruskan ke layanan backend pada jaringan compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Monte Carlo dan NSGA-II dapat berjalan puluhan detik.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA: seluruh rute lain dilayani index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
